schema_version: "0.2.0"
layer: shared-knowledge
status: pilot
owner: designos-core

domains: [design, ux, product, frontend, research]
known_skills: [uxeval, prd2proto, ai-analytics]

assets:
  - id: ux.heuristic-principles
    version: 0.2.0-pilot
    domain: ux
    type: principles
    applicable_skills: [uxeval]
    source_of_truth: knowledge/ux/heuristic-principles.md
    decision_use: 统一体验评估原则选择、原则映射与严重等级基础口径
    quality_bar: 含 purpose/applies_to/decision_framework/senior_heuristics/quality_rubric/common_failure_modes/source_assets/do_not_claim
    do_not_claim: 不规定评分公式；不定义某次评估任务清单
    owner: designos-core
    status: pilot
  - id: ux.journey-modeling
    version: 0.2.0-pilot
    domain: ux
    type: methodology
    applicable_skills: [uxeval]
    source_of_truth: knowledge/ux/journey-modeling.md
    decision_use: 从页面视角升级到用户旅程视角，支撑任务生成与问题归因
    quality_bar: 含六阶段模板、旅程判定、质量 rubric 与 failure modes
    do_not_claim: 不规定输出 schema；不替代用户访谈
    owner: designos-core
    status: pilot
  - id: ux.evidence-quality
    version: 0.2.0-pilot
    domain: ux
    type: standard
    applicable_skills: [uxeval]
    source_of_truth: knowledge/ux/evidence-quality.md
    decision_use: 判定评估证据是否足以支撑问题清单与交付状态
    quality_bar: 含证据类型、充分性三属性、交付四态与失败模式
    do_not_claim: 不规定采集工具、文件格式或路径
    owner: designos-core
    status: pilot
  - id: ux.severity-rubric
    version: 0.2.0-pilot
    domain: ux
    type: rubric
    applicable_skills: [uxeval]
    source_of_truth: knowledge/ux/severity-rubric.md
    decision_use: 统一 critical/major/minor/suggestion 严重等级判定
    quality_bar: 等级由用户影响、频次、风险、可恢复性共同决定
    do_not_claim: 不定义产品级优先级路线图或扣分公式
    owner: designos-core
    status: pilot
  - id: ux.issue-attribution
    version: 0.2.0-pilot
    domain: ux
    type: methodology
    applicable_skills: [uxeval]
    source_of_truth: knowledge/ux/issue-attribution.md
    decision_use: 把 raw issue 转成可评审、可修复、可追溯的结构化问题
    quality_bar: 含八步归因、建议模板、去重规则、功能测试偏移防线
    do_not_claim: 不定义具体 Issue schema；不保证自动归因 100% 正确
    owner: designos-core
    status: pilot
  - id: ux.ux-failure-modes
    version: 0.2.0-pilot
    domain: ux
    type: failure_modes
    applicable_skills: [uxeval]
    source_of_truth: knowledge/ux/ux-failure-modes.md
    decision_use: 用真实失败样例沉淀前置 calibration 与质量门控
    quality_bar: 每个失败模式含现象、识别信号、根因、防线
    do_not_claim: 不保证覆盖所有未来失败模式
    owner: designos-core
    status: pilot

  - id: product.prd-understanding
    version: 0.2.0-pilot
    domain: product
    type: methodology
    applicable_skills: [prd2proto]
    source_of_truth: knowledge/product/prd-understanding.md
    decision_use: 把非结构化 PRD 转成业务目标、模块、功能、页面、用户流
    quality_bar: 推断显式标注，缺口写 warnings，不替 PM 发明需求
    do_not_claim: 不替代需求评审；不保证推断真实成立
    owner: designos-core
    status: pilot
  - id: product.information-architecture
    version: 0.2.0-pilot
    domain: product
    type: methodology
    applicable_skills: [prd2proto]
    source_of_truth: knowledge/product/information-architecture.md
    decision_use: 组织 sitemap/navigation/route/critical path 四视图
    quality_bar: 四视图一致、可直接供实现消费
    do_not_claim: 不规定前端路由库；不生成具体页面设计稿
    owner: designos-core
    status: pilot
  - id: product.user-story-mapping
    version: 0.2.0-pilot
    domain: product
    type: methodology
    applicable_skills: [prd2proto]
    source_of_truth: knowledge/product/user-story-mapping.md
    decision_use: 用 story mapping 拆 modules/features/pages/flows 与关键路径
    quality_bar: 结构可追踪，feature 满足 INVEST
    do_not_claim: 不替代 roadmap 排期；不决定功能是否应该做
    owner: designos-core
    status: pilot
  - id: product.interaction-state-coverage
    version: 0.2.0-pilot
    domain: product
    type: standard
    applicable_skills: [prd2proto, uxeval]
    source_of_truth: knowledge/product/interaction-state-coverage.md
    decision_use: 判断交互组件与流程是否覆盖关键状态和异常路径
    quality_bar: 关键交互状态齐全，非适用状态有理由
    do_not_claim: 不规定具体 CSS 实现；不替代无障碍专项审查
    owner: designos-core
    status: pilot

  - id: frontend.atomic-design
    version: 0.2.0-pilot
    domain: frontend
    type: methodology
    applicable_skills: [prd2proto]
    source_of_truth: knowledge/frontend/atomic-design.md
    decision_use: 组织 atoms/molecules/organisms/templates/pages 的组件分层
    quality_bar: 层级清晰、命名稳定、引用方向单一、复用边界明确
    do_not_claim: 不规定具体框架或组件库 API
    owner: designos-core
    status: pilot
  - id: frontend.design-token-rules
    version: 0.2.0-pilot
    domain: frontend
    type: standard
    applicable_skills: [prd2proto]
    source_of_truth: knowledge/frontend/design-token-rules.md
    decision_use: 规范 design token 三层架构、命名、引用与 CSS 变量输出
    quality_bar: 三层清楚、引用可解析、命名语义化
    do_not_claim: 不规定具体 token 值或构建工具
    owner: designos-core
    status: pilot
  - id: frontend.component-state-rules
    version: 0.2.0-pilot
    domain: frontend
    type: standard
    applicable_skills: [prd2proto]
    source_of_truth: knowledge/frontend/component-state-rules.md
    decision_use: 规范交互组件 default/hover/active/focus/disabled/loading/error 覆盖
    quality_bar: 关键交互组件状态齐全，视觉/文案/行为一致
    do_not_claim: 不覆盖业务状态机的全部领域状态
    owner: designos-core
    status: pilot
  - id: frontend.code-quality-constitution
    version: 0.2.0-pilot
    domain: frontend
    type: standard
    applicable_skills: [prd2proto]
    source_of_truth: knowledge/frontend/code-quality-constitution.md
    decision_use: 定义前端生成代码质量底线和 review gate 宪法
    quality_bar: 四条规则可定位扫描，违规有修复建议与严重等级
    do_not_claim: 不定义 ESLint/Prettier/CI；不保证生产可上线
    owner: designos-core
    status: pilot

  - id: research.methodology-selection
    version: 0.2.0-pilot
    domain: research
    type: methodology
    applicable_skills: [ai-analytics]
    source_of_truth: knowledge/research/methodology-selection.md
    decision_use: 按目标与证据选择最小够用分析方法论
    quality_bar: 方法论与问题/证据/产物一一对应，缺口明确
    do_not_claim: 不规定某 skill 的选择算法；不替代数据质量审查
    owner: designos-core
    status: pilot
  - id: research.competitor-analysis
    version: 0.2.0-pilot
    domain: research
    type: methodology
    applicable_skills: [ai-analytics]
    source_of_truth: knowledge/research/competitor-analysis.md
    decision_use: 把竞品资料转为可追溯 findings 与比较矩阵
    quality_bar: findings 与矩阵均可追溯，维度服务最终策略
    do_not_claim: 不自动爬取或验证外部资料；不预设行业
    owner: designos-core
    status: pilot
  - id: research.user-persona-quality
    version: 0.2.0-pilot
    domain: research
    type: methodology
    applicable_skills: [ai-analytics]
    source_of_truth: knowledge/research/user-persona-quality.md
    decision_use: 评估 persona 是否可被设计/产品决策消费
    quality_bar: 角色、目标、痛点、场景、证据完整且可行动
    do_not_claim: 不替代真实用户研究；不预设具体用户群
    owner: designos-core
    status: pilot
  - id: research.data-completeness-rubric
    version: 0.2.0-pilot
    domain: research
    type: rubric
    applicable_skills: [ai-analytics]
    source_of_truth: knowledge/research/data-completeness-rubric.md
    decision_use: 判断数据是否足以支撑策略、画像与竞品结论
    quality_bar: coverage 与 gaps 有证据依据，能决定继续/补资料
    do_not_claim: 不保证数据来源真实可靠；不自动补齐资料
    owner: designos-core
    status: pilot

  - id: design.design-strategy
    version: 0.2.0-pilot
    domain: design
    type: methodology
    applicable_skills: [ai-analytics, prd2proto]
    source_of_truth: knowledge/design/design-strategy.md
    decision_use: 把分析结论转成目标人群、商业目标、设计原则、气质关键词
    quality_bar: 策略可执行、可取舍、有证据，能指导模板/IA/组件选择
    do_not_claim: 不替代品牌战略；不规定最终视觉稿
    owner: designos-core
    status: pilot
  - id: design.design-template-selection
    version: 0.2.0-pilot
    domain: design
    type: methodology
    applicable_skills: [prd2proto]
    source_of_truth: knowledge/design/design-template-selection.md
    decision_use: 按产品定位特征选择视觉模板并做有限微调
    quality_bar: 选择理由可解释，微调有限且不破坏模板核心
    do_not_claim: 不复制模板 token 全文；不替代用户 design-spec
    owner: designos-core
    status: pilot
  - id: design.tone-and-visual-direction
    version: 0.2.0-pilot
    domain: design
    type: methodology
    applicable_skills: [ai-analytics, prd2proto]
    source_of_truth: knowledge/design/tone-and-visual-direction.md
    decision_use: 把目标用户、业务目标、竞品定位转成 tone keywords 与视觉方向
    quality_bar: tone 与用户/目标/竞品定位一致，并能落到视觉决策
    do_not_claim: 不替代品牌手册；不产出最终视觉稿
