name: Bug Report
description: Report a bug or unexpected behavior in DesignOS
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **⚠️ Privacy Notice**

        Do not paste:
        - Real PRD text
        - Screenshots with sensitive content
        - Real URLs, credentials, or tokens
        - Customer names or local file paths
        - Full run workspace archives
        - Business confidential text

        Use sanitized diagnostic summaries only.

  - type: dropdown
    id: skill
    attributes:
      label: Skill
      description: Which skill were you using?
      options:
        - prd2proto
        - uxeval
        - ai-analytics
        - ip-design
        - brand-creative
        - other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the issue (sanitized, no real PRD/screenshots/URLs)
      placeholder: e.g., "prd2proto failed at design_objectives stage"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: diagnostic-summary
    attributes:
      label: Diagnostic Summary (optional)
      description: Paste sanitized diagnostic summary if available
      placeholder: |
        run_id: RUN-YYYYMMDD-001
        skill: prd2proto
        delivery_decision: block
        triggered_failure_modes: FM-PRD2PROTO-002
      render: yaml

  - type: input
    id: version
    attributes:
      label: DesignOS Version
      placeholder: e.g., v1.0.0-pilot

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: macOS 14
        Node: 20.x
        Claude: Opus

  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: Privacy Confirmation
      description: You must confirm privacy rules
      options:
        - label: I have not included real PRD, screenshots with sensitive content, URLs, credentials, customer names, local paths, full run workspace archives, or business confidential text
          required: true
