line-length = 100
target-version = "py311"

extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "legacy",
    "docs",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"__init__.py"   = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
